<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b3a2b">
  <title>Pahtlikalli - Fichas de Terreno</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <header class="topbar">
    <button id="btn-atras" style="display:none">← Atrás</button>
    <h1 id="titulo">🌱 Pahtlikalli</h1>
    <!-- v2: forzar actualización de la app (service worker + caché) -->
    <button id="btn-actualizar" title="Actualizar app" aria-label="Actualizar app">🔄</button>
    <!-- v2: menú de backup (exportar / importar) -->
    <button id="btn-backup" title="Backup de datos" aria-label="Backup de datos">💾 Backup</button>
  </header>

  <!-- v2: menú de backup. Botones grandes y táctiles (ver styles.css) -->
  <div class="menu-backdrop" id="menu-backdrop"></div>
  <div class="menu-backup" id="menu-backup" role="menu" aria-label="Backup de datos">
    <button class="btn full" id="btn-export-backup" role="menuitem">💾 Exportar backup (JSON completo)</button>
    <button class="btn sec full" id="btn-import-backup" role="menuitem">📥 Importar backup…</button>
    <button class="btn sec full" id="btn-export-csv" role="menuitem">📊 Exportar CSV (resumen)</button>
    <button class="btn sec full" id="btn-cerrar-menu" role="menuitem">Cancelar</button>
  </div>

  <input type="file" id="input-backup" accept=".json,application/json" style="display:none">

  <main id="app"></main>

  <div class="toast" id="toast"></div>

  <div class="modal" id="modal-foto">
    <button class="cerrar" onclick="document.getElementById('modal-foto').classList.remove('show')">×</button>
    <img id="modal-img" src="" alt="">
  </div>

  <input type="file" id="input-foto" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="input-foto-criterio" accept="image/*" capture="environment" style="display:none">

  <script src="app.js"></script>
</body>
</html>
